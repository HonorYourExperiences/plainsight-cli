name: Bug or crash
description: The command fails, the report doesn't open, or something looks broken.
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: npx plainsight-cli ../my-app --open
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the terminal output, or a screenshot of the report.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Plainsight version, Node version, OS
      placeholder: 0.3.0, Node 22, macOS 15
