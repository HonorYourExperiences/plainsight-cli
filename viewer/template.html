<style>
/* Layout: app shell. Top bar, schematic canvas on graph paper (left), readout panel (right). Type is IBM Plex, the same families as the Adobe Fonts kit used for design boards. */
:root {
  --paper: #EBEFED; --sheet: #F7F9F8; --ink: #17231F; --muted: #56665F; --rule: #C6D0CC; --grid: rgba(23,35,31,.05);
  --zone: rgba(23,35,31,.028);
  --flow: #0B7782; --flow-soft: rgba(11,119,130,.13);
  --crit: #C22F2F; --crit-soft: rgba(194,47,47,.1); --warn: #A86A12; --warn-soft: rgba(168,106,18,.12); --info: #4A5D9C; --info-soft: rgba(74,93,156,.11);
  --on: #FFFFFF;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1412; --sheet: #141C19; --ink: #DCE5E1; --muted: #8B9A94; --rule: #2B3732; --grid: rgba(220,229,225,.04); --zone: rgba(220,229,225,.025);
  --flow: #3EC3CD; --flow-soft: rgba(62,195,205,.14); --crit: #F0675F; --crit-soft: rgba(240,103,95,.13); --warn: #E2A84B; --warn-soft: rgba(226,168,75,.13); --info: #93A6E8; --info-soft: rgba(147,166,232,.13);
  --on: #0E1412; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1412; --sheet: #141C19; --ink: #DCE5E1; --muted: #8B9A94; --rule: #2B3732; --grid: rgba(220,229,225,.04); --zone: rgba(220,229,225,.025);
  --flow: #3EC3CD; --flow-soft: rgba(62,195,205,.14); --crit: #F0675F; --crit-soft: rgba(240,103,95,.13); --warn: #E2A84B; --warn-soft: rgba(226,168,75,.13); --info: #93A6E8; --info-soft: rgba(147,166,232,.13);
  --on: #0E1412; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-body); display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--rule); background: var(--sheet);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-head); font-weight: 600; font-size: 19px; letter-spacing: .01em; }
.brand svg { flex: none; }
.repo { display: flex; align-items: center; gap: 8px; min-width: 0; }
.repo select { border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 4px 8px; max-width: 100%; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 3px; color: var(--muted); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }
.search { border: 1px solid var(--rule); background: var(--paper); border-radius: 3px; padding: 5px 9px; width: 210px; max-width: 100%; }

/* Workspace */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; }
.canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; cursor: grab;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.canvas.dragging { cursor: grabbing; }
#map { width: 100%; height: 100%; display: block; touch-action: none; }
.legend { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 12px; padding: 7px 11px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; font-size: 11.5px; color: var(--muted); max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.zoomctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; border: 1px solid var(--rule); background: var(--sheet); border-radius: 3px; }
.zoomctl button { border: 0; background: none; width: 32px; height: 30px; cursor: pointer; font-family: var(--f-mono); font-size: 15px; }
.zoomctl button + button { border-top: 1px solid var(--rule); }
.zoomctl button:hover { color: var(--flow); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--f-mono); font-size: 12px; }

/* SVG */
.zone-band { fill: var(--zone); }
.zone-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; fill: var(--muted); }
.pipe { fill: none; stroke: var(--ink); stroke-width: 1.6; opacity: .85; }
.pipe.relation { stroke: var(--muted); stroke-dasharray: 3 4; stroke-width: 1.2; }
.pipe.unresolved { stroke: var(--muted); stroke-dasharray: 7 5; }
.pipe.inferred { stroke: var(--muted); stroke-dasharray: 1.5 4; stroke-linecap: round; stroke-width: 1.8; }
.pipe.write { stroke-width: 2.2; }
.pipe-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.edge.on .pipe { stroke: var(--flow); stroke-width: 2.6; opacity: 1; }
.edge.on .pipe.relation, .edge.on .pipe.unresolved, .edge.on .pipe.inferred { stroke: var(--flow); }
.node { cursor: pointer; }
.node .body { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
.node.unknown .body { stroke: var(--muted); stroke-dasharray: 5 4; }
.node:hover .body { stroke: var(--flow); }
.node.sel .body { stroke: var(--flow); stroke-width: 2.6; fill: var(--flow-soft); }
.node .kind { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .07em; fill: var(--muted); }
.node .name { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
.node .sub { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); }
.badge-crit { fill: var(--crit); } .badge-warn { fill: var(--warn); } .badge-info { fill: var(--info); } .badge-unk { fill: var(--muted); }
.badge-t { fill: var(--on); font-family: var(--f-mono); font-size: 11px; font-weight: 500; text-anchor: middle; }
.valve { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; }
.valve.partial { stroke: var(--warn); fill: var(--warn-soft); }
.valve.checked { stroke: var(--flow); fill: var(--flow-soft); }
.gap { fill: var(--crit-soft); stroke: var(--crit); stroke-width: 1.4; stroke-dasharray: 3 2; }
.gap-x { stroke: var(--crit); stroke-width: 1.6; }
svg.focus .node:not(.near) { opacity: .25; }
svg.focus .edge:not(.on) { opacity: .12; }
svg.focus .guard:not(.on) { opacity: .2; }
.node, .edge, .guard { transition: opacity .2s; }

/* Panel */
.panel { border-left: 1px solid var(--rule); background: var(--sheet); overflow-y: auto; min-height: 0; padding: 18px 20px 28px; display: grid; gap: 18px; align-content: start; }
.panel h2 { font-family: var(--f-head); font-size: 22px; font-weight: 600; margin: 0; line-height: 1.15; overflow-wrap: anywhere; text-wrap: balance; }
.panel h3 { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.back { background: none; border: 0; padding: 0; color: var(--flow); cursor: pointer; font-size: 13px; font-weight: 500; justify-self: start; }
.back:hover { text-decoration: underline; }
.stack { display: grid; gap: 6px; }
.counts { display: flex; flex-wrap: wrap; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.counts div { flex: 1 1 30%; background: var(--sheet); padding: 8px 10px; display: grid; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.counts b { font-family: var(--f-head); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.counts span { font-size: 12px; color: var(--muted); }
.find { width: 100%; text-align: left; border: 1px solid var(--rule); background: var(--sheet); padding: 9px 11px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; border-radius: 3px; }
.find:hover { border-color: var(--flow); }
.find strong { font-weight: 600; font-size: 13.5px; }
.find .where { grid-column: 2; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); overflow-wrap: anywhere; }
.sev { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 2px; align-self: start; margin-top: 2px; color: var(--on); white-space: nowrap; }
.sev.crit { background: var(--crit); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); }
.empty { font-size: 13px; color: var(--muted); border: 1px dashed var(--rule); padding: 10px 12px; border-radius: 3px; }
.claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.claims details { border-radius: 3px; }
.claims summary { list-style: none; cursor: pointer; padding: 6px 8px 6px 22px; position: relative; border-radius: 3px; }
.claims summary::-webkit-details-marker { display: none; }
.claims summary::before { content: ""; position: absolute; left: 8px; top: 13px; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
.claims details[open] summary::before { transform: rotate(45deg); top: 11px; }
.claims summary:hover { background: var(--paper); }
.claims .norc summary { cursor: default; padding-left: 8px; }
.claims .norc summary::before { display: none; }
.claims .norc summary:hover { background: none; }
.rc { font-family: var(--f-mono); font-size: 10px; color: var(--flow); margin-left: 6px; white-space: nowrap; }
.receipts { display: grid; gap: 6px; padding: 4px 0 8px 22px; }
.ev { border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; background: var(--sheet); }
.ev-h { display: flex; justify-content: space-between; gap: 8px; padding: 5px 9px; background: var(--paper); border-bottom: 1px solid var(--rule); font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.ev-h span:first-child { color: var(--ink); overflow-wrap: anywhere; }
.ev pre { margin: 0; padding: 8px 9px; overflow-x: auto; font: 11px/1.55 var(--f-mono); white-space: pre; }
.ev-note { font-family: var(--f-mono); font-size: 10px; color: var(--muted); padding: 0 0 0 2px; }
.arrow-down { font-family: var(--f-mono); color: var(--muted); font-size: 11px; padding-left: 8px; }
.basis { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; }
.basis.proven { background: var(--flow-soft); color: var(--flow); }
.basis.library { background: var(--info-soft); color: var(--info); }
.basis.inferred, .basis.unresolved { background: var(--warn-soft); color: var(--warn); }
.flag { border-left: 3px solid var(--crit); background: var(--crit-soft); padding: 9px 11px; display: grid; gap: 4px; font-size: 13.5px; }
.flag.warn { border-color: var(--warn); background: var(--warn-soft); } .flag.info { border-color: var(--info); background: var(--info-soft); }
.flag strong { font-weight: 600; }
.links { display: grid; gap: 4px; }
.link { border: 1px solid var(--rule); background: var(--sheet); border-radius: 3px; padding: 5px 9px; cursor: pointer; display: grid; grid-template-columns: 80px 1fr; gap: 8px; text-align: left; font-size: 13px; align-items: baseline; }
.link:hover { border-color: var(--flow); }
.link small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.link span { overflow-wrap: anywhere; }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; }
.files li { overflow-wrap: anywhere; }
.meter { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--flow); }
details.more summary { cursor: pointer; font-size: 13px; color: var(--flow); }
.limits { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; display: grid; gap: 4px; }

/* zoom levels */
.levels { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 8px 6px 11px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; max-width: calc(100% - 70px); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 11px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: baseline; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--flow-soft); color: var(--flow); }
.seg button[aria-pressed="true"] small { color: var(--flow); }
.seg button:hover { color: var(--flow); }
.close-all { border: 0; background: none; color: var(--flow); cursor: pointer; font-size: 12.5px; padding: 2px 4px; }
.close-all:hover { text-decoration: underline; }
.node.group .body, .node.zone .body { stroke-width: 1.6; }
.node .stack { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.1; opacity: .7; }
.node.zone .name { font-family: var(--f-head); font-size: 21px; }
.node.zone .kind { font-size: 11px; } .node.zone .sub { font-size: 12px; }
.pipe.agg { opacity: .7; }
.count rect { fill: var(--sheet); stroke: var(--rule); }
.count text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); text-anchor: middle; }
.count.on rect { stroke: var(--flow); } .count.on text { fill: var(--flow); }
svg.focus .count:not(.on) { opacity: .2; }
.inline-link { background: none; border: 0; padding: 0; color: var(--flow); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--rule); background: var(--paper); padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--flow); color: var(--flow); }

/* hologram: a deliberately dark, single-look view in both themes */
.holo { position: absolute; inset: 0; overflow: hidden; color: #D6F6FF; perspective: 1900px; perspective-origin: 50% 40%; cursor: grab; touch-action: none; user-select: none;
  background: radial-gradient(ellipse at 50% 72%, #062238 0%, #02101D 48%, #01060D 82%); }
.holo.dragging { cursor: grabbing; }
.holo-base { position: absolute; left: 50%; bottom: 40px; width: 620px; height: 130px; margin-left: -310px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(92,225,255,.45) 0%, rgba(92,225,255,.1) 45%, transparent 70%); }
.holo-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(214,246,255,.03) 0 1px, transparent 1px 3px); }
.holo-scene { position: absolute; left: 50%; top: 47%; width: 0; height: 0; transform-style: preserve-3d; transition: transform .12s linear; }
.holo-plate { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 1.5px solid rgba(123,231,255,.7); background-color: rgba(92,225,255,.045);
  background-image: linear-gradient(rgba(92,225,255,.11) 1px, transparent 1px), linear-gradient(90deg, rgba(92,225,255,.11) 1px, transparent 1px); background-size: 20px 20px;
  box-shadow: 0 0 30px rgba(92,225,255,.3), inset 0 0 40px rgba(92,225,255,.1); pointer-events: none; }
.holo-plate span { position: absolute; left: 12px; bottom: 9px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .18em; color: #7BE7FF; }
.holo-plate span.tel { left: auto; right: 12px; color: #9BDDF0; letter-spacing: .12em; }
.holo-plate span.tel b { color: #FF7A88; font-weight: 600; }
/* machined corners and a ruler along the far edge */
.holo-plate::before { content: ""; position: absolute; inset: -7px; pointer-events: none;
  background: linear-gradient(#BFF4FF, #BFF4FF) left top / 24px 2px no-repeat, linear-gradient(#BFF4FF, #BFF4FF) left top / 2px 24px no-repeat,
    linear-gradient(#BFF4FF, #BFF4FF) right top / 24px 2px no-repeat, linear-gradient(#BFF4FF, #BFF4FF) right top / 2px 24px no-repeat,
    linear-gradient(#BFF4FF, #BFF4FF) left bottom / 24px 2px no-repeat, linear-gradient(#BFF4FF, #BFF4FF) left bottom / 2px 24px no-repeat,
    linear-gradient(#BFF4FF, #BFF4FF) right bottom / 24px 2px no-repeat, linear-gradient(#BFF4FF, #BFF4FF) right bottom / 2px 24px no-repeat; }
.holo-plate::after { content: ""; position: absolute; left: 30px; right: 30px; top: -12px; height: 6px; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(123,231,255,.7) 0 1px, transparent 1px 20px), repeating-linear-gradient(90deg, rgba(123,231,255,.9) 0 1px, transparent 1px 100px) 0 0 / 100% 10px no-repeat; }
.holo-tile { position: absolute; left: 0; top: 0; width: 180px; height: 58px; box-sizing: border-box; padding: 6px 10px; display: flex; flex-direction: column; justify-content: center; gap: 1px;
  background: rgba(92,225,255,.08); border: 1.5px solid #5CE1FF; box-shadow: 0 0 12px rgba(92,225,255,.45); color: #FFFFFF; cursor: pointer; font-family: var(--f-mono);
  transform-style: preserve-3d; --edge: rgba(123,231,255,.85); --wall: rgba(92,225,255,.24); transition: color .2s, border-color .2s, background-color .2s, box-shadow .2s; }
/* towers: a part stands as tall as the number of pipes that come into it */
.holo-tile .face { position: absolute; pointer-events: none; box-sizing: border-box; border: 1px solid var(--edge); background: linear-gradient(var(--wall), rgba(92,225,255,.04)); box-shadow: inset 0 0 10px var(--wall); transition: border-color .2s, background .2s; }
.holo-tile .face.ns { left: -1.5px; width: calc(100% + 3px); height: var(--h); transform-origin: 50% 0; transform: rotateX(-90deg); }
.holo-tile .face.n { top: -1.5px; } .holo-tile .face.s { top: calc(100% + 1.5px); }
.holo-tile .face.ew { top: -1.5px; height: calc(100% + 3px); width: var(--h); transform-origin: 0 50%; transform: rotateY(90deg); }
.holo-tile .face.w { left: -1.5px; } .holo-tile .face.e { left: calc(100% + 1.5px); }
.holo-tile .hop { position: absolute; right: -1.5px; top: -17px; font-size: 9.5px; letter-spacing: .08em; padding: 1px 6px; display: none; }
.holo.trace .holo-tile.near .hop { display: block; }
.holo-tile.down .hop { background: #5CE1FF; color: #02101D; }
.holo-tile.up .hop { background: #C59BFF; color: #12052A; }
.holo-tile.up { border-color: #C59BFF; --edge: rgba(197,155,255,.7); --wall: rgba(197,155,255,.16); box-shadow: 0 0 14px rgba(197,155,255,.55); }
.holo-tile .k { font-size: 9.5px; letter-spacing: .1em; color: #9BDDF0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.holo-tile .n { font-family: var(--f-head); font-weight: 600; font-size: 15px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.holo-tile.group { box-shadow: 5px 5px 0 -1px #021320, 5px 5px 0 0 #5CE1FF, 0 0 12px rgba(92,225,255,.45); }
.holo-tile.out { border-color: rgba(160,196,210,.85); }
.holo-tile.unknown { border-style: dashed; }

<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script>
const GRAPHS = /*__GRAPHS__*/[];
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map"), panel = document.getElementById("panel");
  const ZONES = [
    { key: "see", label: "WHAT USERS SEE", kinds: ["page"] },
    { key: "browser", label: "RUNS IN THE BROWSER", kinds: ["module"] },
    { key: "server", label: "YOUR SERVER", kinds: ["route", "action"] },
    { key: "data", label: "STORED DATA & FILES", kinds: ["table", "storage", "asset"] },
    { key: "out", label: "OUTSIDE SERVICES", kinds: ["service", "host", "unknown"] },
  ];
  const zoneOf = (n) => ZONES.findIndex((z) => z.kinds.includes(n.kind));
  const KIND = { page: "PAGE", route: "API ROUTE", action: "SERVER ACTION", table: "TABLE", service: "SERVICE", host: "ADDRESS", unknown: "UNRESOLVED", module: "MODULE", storage: "SAVED DATA", asset: "APP FILES" };
  const PLURAL = { page: "pages", route: "routes", action: "server actions", table: "tables", service: "services", host: "addresses", unknown: "unresolved", module: "modules", storage: "saved-data keys", asset: "file folders" };
  const W = 216, H = 58;
  let G, byId, selected = null, findingsByNode = {};
  let level = "parts", expanded = new Set(), V = null;
  // "Fix now" items this viewer has already opened. Per browser only; the red marking stays until the code changes.
  const seenKey = (id) => `ps-seen:${G.app}:${G.commit || ""}:${id}`;
  const isSeen = (id) => { try { return localStorage.getItem(seenKey(id)) === "1"; } catch { return false; } };
  const markSeen = (id) => { try { localStorage.setItem(seenKey(id), "1"); } catch {} };
  const critNodes = () => [...new Set(G.findings.filter((f) => f.sev === "crit" && f.node && byId[f.node]).map((f) => f.node))];
  let fixIdx = -1; // V: the current view (drawn nodes + edges)
  let view = { x: 0, y: 0, w: 1000, h: 600 }, bounds;

  const el = (t, a, p, txt) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; if (p) p.appendChild(n); return n; };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
  const label = (n) => n.kind === "route" && !n.worker ? `${n.method === "ANY" ? "" : n.method + " "}${n.name}` : n.name;
  const plural = (k, c) => (c === 1 ? (KIND[k] || k).toLowerCase().replace("api route", "route") : PLURAL[k] || k);
  const countsText = (ids) => { const c = {}; for (const id of ids) { const k = byId[id].kind; c[k] = (c[k] || 0) + 1; } return Object.entries(c).map(([k, v]) => `${v} ${plural(k, v)}`).join(" · "); };

  // ---------- grouping: every group comes from a fact in the code ----------
  // returns { key, label, rule } or null when the part stands alone
  let groupOf = {};
  function computeGroups() {
    groupOf = {};
    const nodes = G.nodes;
    const set = (n, key, lbl, rule) => (groupOf[n.id] = { key, label: lbl, rule });
    // pages: by a script that three or more pages load directly; pages with no scripts together
    const pages = nodes.filter((n) => n.kind === "page" && !n.layout);
    const loads = {}; for (const p of pages) loads[p.id] = G.edges.filter((e) => e.from === p.id && e.kind === "load").map((e) => e.to);
    const freq = {}; Object.values(loads).flat().forEach((m) => (freq[m] = (freq[m] || 0) + 1));
    for (const p of pages) {
      if (G.stack?.static) {
        if (!loads[p.id].length) { set(p, "pages:static", "Static pages", "These pages load no scripts."); continue; }
        const shared = loads[p.id].filter((m) => freq[m] >= 3).sort((a, b) => freq[b] - freq[a])[0];
        if (shared) { set(p, "pages:" + shared, `Pages that load ${byId[shared].name}`, `Each of these pages loads ${byId[shared].name} directly.`); continue; }
        const pair = loads[p.id].filter((m) => freq[m] === 2).sort()[0];
        if (pair) { set(p, "pages:" + pair, `Pages that load ${byId[pair].name}`, `Each of these pages loads ${byId[pair].name} directly.`); continue; }
      } else {
        const seg = (p.route || p.name).split("/").filter(Boolean)[0];
        if (seg) set(p, "pages:/" + seg, `Pages under /${seg}`, `These pages' addresses all start with /${seg}.`);
      }
    }
    for (const n of nodes) {
      if (n.kind === "module") {
        if (n.sw) continue;
        if (n.vendor) { set(n, "mod:vendor", "Third-party libraries", "Library files bundled with the app. Plainsight doesn't look inside them."); continue; }
        const dir = n.file.split("/").slice(0, -1).join("/"), root = G.stack?.static?.webRoot || "";
        if (dir !== root) { const d = root && dir.startsWith(root + "/") ? dir.slice(root.length + 1) : dir; set(n, "mod:dir:" + d, `Folder ${d}/`, `These modules live in the ${d}/ folder.`); continue; }
        const u = (n.usedBy || []).length;
        if (!u) set(n, "mod:unused", "Not loaded by any page", "No page loads these modules, directly or through other modules.");
        else if (u === 1) set(n, "mod:only:" + n.usedBy[0], `Only ${byId[n.usedBy[0]]?.name || n.usedBy[0]}`, `Only the ${byId[n.usedBy[0]]?.name} page uses these modules.`);
        else if (u === 2) set(n, "mod:shared2", "Shared by 2 pages", "Each of these modules is used by exactly two pages.");
        else if (u <= 5) set(n, "mod:shared3", "Shared by 3–5 pages", "Each of these modules is used by three to five pages.");
        else set(n, "mod:shared6", "Shared by 6+ pages", "Each of these modules is used by six or more pages: the app's common core.");
      } else if (n.kind === "action") set(n, "act:" + n.file, `Actions in ${n.file.split("/").pop()}`, `These server actions are all defined in ${n.file}.`);
      else if (n.kind === "route" && !n.worker) { const segs = n.name.split("/").filter(Boolean); const k = segs[0] === "api" ? segs.slice(0, 2).join("/") : segs[0]; if (k) set(n, "route:/" + k, `Routes under /${k}`, `These routes' addresses all start with /${k}.`); }
      else if (n.kind === "storage" && nodes.filter((x) => x.kind === "storage").length > 6) set(n, "store:" + n.store, n.store === "caches" ? "Offline caches" : `Saved data (${n.store})`, `These are keys the app saves in the visitor's browser (${n.store}).`);
      else if (n.kind === "table" && nodes.filter((x) => x.kind === "table").length > 10) set(n, "tables", "Database tables", "All tables in the database.");
      else if (["host", "service", "unknown"].includes(n.kind) && nodes.filter((x) => ["host", "service", "unknown"].includes(x.kind)).length > 8) set(n, "out:" + n.kind, `Outside ${PLURAL[n.kind]}`, `All ${PLURAL[n.kind]} outside the app.`);
    }
    // a group of one is just the part
    const sizes = {}; Object.values(groupOf).forEach((g) => (sizes[g.key] = (sizes[g.key] || 0) + 1));
    for (const id in groupOf) if (sizes[groupOf[id].key] < 2) delete groupOf[id];
  }

  // ---------- the view at the current zoom level ----------

  // nodeIds / edgeIds are ids in the current view
  function focus(nodeIds, edgeIds) {
    const R = mode === "holo" ? holo : svg;
    R.classList.toggle("focus", !!nodeIds);
    R.querySelectorAll(".node").forEach((g) => { g.classList.toggle("sel", g.dataset.id === selected); g.classList.toggle("near", !!nodeIds && nodeIds.has(g.dataset.id)); });
    R.querySelectorAll(".edge").forEach((g) => g.classList.toggle("on", !!edgeIds && edgeIds.has(g.dataset.id)));
    R.querySelectorAll(".guard, .count").forEach((g) => g.classList.toggle("on", !!edgeIds && edgeIds.has(g.dataset.edge)));
    const run = document.getElementById("holoRun"); if (run) run.disabled = !selected;
    if (R === holo && holo.querySelector(".holo-tile")) { applyTrace(); inspectSelected(); }
  }
  const focusReal = (nodeIds, realEdgeIds) => focus(new Set([...nodeIds].map((id) => V.rep[id] || id)), new Set([...realEdgeIds].map((id) => V.realToView[id]).filter(Boolean)));

  // ---------- receipts ----------
  function evHtml(e) {
    return `<div class="ev"><div class="ev-h"><span>${esc(e.file)}</span><span>${e.endLine && e.endLine !== e.line ? `L${e.line}–${e.endLine}` : `L${e.line}`}</span></div><pre><code>${esc(e.code)}</code></pre></div>`;
  }
  function chainHtml(list) {
    if (!list?.length) return "";
    return list.map((e, i) => `${evHtml(e)}${e.note ? `<div class="arrow-down">↓ ${esc(e.note)}</div>` : i < list.length - 1 ? `<div class="arrow-down">↓</div>` : ""}`).join("");
  }
  function claimsHtml(sentences) {
    return `<ul class="claims">${sentences.map((s) => {
      const evs = (s.evidence || []).filter(Boolean);
      if (!evs.length) return `<li><details class="norc"><summary>${esc(s.text)}</summary></details></li>`;
      return `<li><details><summary>${esc(s.text)}<span class="rc">${evs.length} receipt${evs.length > 1 ? "s" : ""}</span></summary><div class="receipts">${chainHtml(evs.slice(0, 8))}</div></details></li>`;
    }).join("")}</ul>`;
  }

  // ---------- panel views ----------
  function wire() {
    panel.querySelectorAll("[data-node]").forEach((b) => b.addEventListener("click", () => reveal(b.dataset.node)));
    panel.querySelectorAll("[data-edge]").forEach((b) => b.addEventListener("click", () => selectEdge(b.dataset.edge)));
    panel.querySelectorAll("[data-agg]").forEach((b) => b.addEventListener("click", () => selectAgg(b.dataset.agg)));
    panel.querySelectorAll("[data-vnode]").forEach((b) => b.addEventListener("click", () => { const id = b.dataset.vnode; id.startsWith("group:") || id.startsWith("zone:") ? selectGroup(id) : selectNode(id); }));
    panel.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openGroup(b.dataset.open)));
    panel.querySelector("#back")?.addEventListener("click", showOverview);
    panel.querySelectorAll(".norc summary").forEach((s) => s.addEventListener("click", (e) => e.preventDefault()));
  }
  function findingBtn(f) {
    const last = f.evidence?.[f.evidence.length - 1];
    const where = f.node ? label(byId[f.node]) : f.file;
    return `<li><button class="find" ${f.node ? `data-node="${esc(f.node)}"` : ""}><span class="sev ${f.sev}">${f.sev === "crit" ? "Fix now" : f.sev === "warn" ? "Fix soon" : "Review"}</span><strong>${esc(f.title)}</strong><span class="where">${esc(where || "")}${last ? ` · ${esc(last.file)}:${last.line}` : ""}</span></button></li>`;
  }
  function showOverview() {
    selected = null; focus(null, null);
    const c = (k) => G.nodes.filter((n) => n.kind === k && !n.layout).length;
    const cov = G.coverage, counted = cov.sourceFiles - cov.tooling.length - cov.tests.length - (cov.docs?.length || 0);
    const fix = G.findings.filter((f) => f.sev !== "info"), review = G.findings.filter((f) => f.sev === "info");
    const notProven = G.edges.filter((e) => e.certainty !== "proven").length;
    const tiles = [["page", "pages"], ["module", "browser modules"], ["route", "API routes"], ["action", "server actions"], ["table", "tables"], ["storage", "saved-data keys"], ["asset", "file folders"]].filter(([k]) => c(k));
    tiles.push(["svc", "outside services", c("service") + c("host")]);
    panel.innerHTML = `
      <div class="stack"><span class="eyebrow">${G.sample ? "Sample app" : "Repository"}</span><h2>${esc(G.app)}</h2>
        <p class="muted">Drawn from the code at ${G.commit ? `commit ${esc(G.commit)}` : "the current files"}. Every part and pipe links to the lines it came from. Click anything.</p></div>
      <div class="counts">${tiles.map(([k, l, v]) => `<div><b>${v ?? c(k)}</b><span>${l}</span></div>`).join("")}<div><b>${G.edges.length}</b><span>pipes, ${notProven} not proven</span></div></div>
      <div class="stack"><h3>Zoom level</h3><p class="muted">${level === "zones" ? "Overview: one box per zone. Pipe counts are exact." : level === "groups" ? `Groups: parts that the code ties together, such as modules used by the same page. Double-click a group to open it. ${expanded.size ? expanded.size + " open." : ""}` : "Every part, one box each."}</p></div>
      <div><h3>Things to fix · ${fix.length}</h3>${fix.length ? `<ul class="claims" style="gap:6px">${fix.map(findingBtn).join("")}</ul>` : `<p class="empty">Nothing in the checks this version runs. That isn't a clean bill of health: see what it can't see below.</p>`}</div>
      ${review.length ? `<div><h3>Worth a look · ${review.length}</h3><ul class="claims" style="gap:6px">${review.map(findingBtn).join("")}</ul></div>` : ""}
      ${G.unknowns.length ? `<div><h3>Couldn't be proven · ${G.unknowns.length}</h3><ul class="claims" style="gap:6px">${G.unknowns.map((u) => `<li><button class="find" data-node="${esc(u.node)}"><span class="sev info" style="background:var(--muted)">?</span><strong>Sends data to ${u.source ? esc(u.source) : "an address built at runtime"}</strong><span class="where">${esc(u.evidence[0]?.file)}:${u.evidence[0]?.line}</span></button></li>`).join("")}</ul></div>` : ""}
      <div class="stack"><h3>Coverage</h3>
        <div class="meter" role="img" aria-label="${cov.mapped} of ${counted} files mapped"><i style="width:${(cov.mapped / Math.max(1, counted) * 100).toFixed(1)}%"></i></div>
        <p class="muted">${cov.mapped} of ${counted} app files are part of the drawing.${cov.tooling.length ? ` ${cov.tooling.length} tooling and script files,` : ""}${cov.tests.length ? ` ${cov.tests.length} tests` : ""}${cov.docs?.length ? ` and ${cov.docs.length} docs/art files` : ""}${cov.tooling.length || cov.tests.length ? " are left out on purpose." : ""}</p>
        ${cov.unmapped.length ? `<details class="more"><summary>${cov.unmapped.length} file${cov.unmapped.length > 1 ? "s" : ""} not reached from any page or route</summary><ul class="files" style="margin-top:6px">${cov.unmapped.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}
      </div>
      <div><h3>What this version can't see</h3><ul class="limits">${G.limits.map((l) => `<li>${esc(l)}</li>`).join("")}</ul></div>`;
    wire();
  }
  // make a real part visible (open its group if needed), then select it
  async function reveal(id) {
    const n = byId[id]; if (!n) return;
    if (V.rep[id] !== id) {
      if (level === "zones") level = "groups";
      const g = groupOf[id]; if (g) expanded.add(g.key);
      await render();
    }
    selectNode(id);
    const near = G.edges.filter((e) => e.from === id || e.to === id).flatMap((e) => [V.rep[e.from], V.rep[e.to]]);
    showArea([...new Set([V.rep[id], ...near])].slice(0, 12));
  }
  async function openGroup(vid) {
    if (vid.startsWith("zone:")) { level = "groups"; expanded.clear(); await render(); showOverview(); return; }
    const members = V.nodes.find((n) => n.id === vid)?.members || [];
    expanded.add(vid.slice(6)); await render(); showOverview();
    showArea(members);
  }
  function selectNode(id) {
    const n = byId[id]; if (!n) return;
    if ((findingsByNode[id] || []).some((f) => f.sev === "crit") && !isSeen(id)) {
      markSeen(id);
      const vid = V.rep[id] || id;
      const ring = svg.querySelector(`.node[data-id="${CSS.escape(vid)}"] .alarm-ring`);
      const stillUnseen = (V.nodes.find((x) => x.id === vid)?.members || []).some((m) => (findingsByNode[m] || []).some((f) => f.sev === "crit") && !isSeen(m));
      if (ring && !stillUnseen) ring.remove();
      const ci = critNodes().indexOf(id); if (ci >= 0) fixIdx = ci;
      updateFixNav();
    }
    selected = V.rep[id] || id;
    const es = G.edges.filter((e) => e.from === id || e.to === id);
    focusReal(new Set([id, ...es.flatMap((e) => [e.from, e.to])]), new Set(es.map((e) => e.id)));
    const fs = findingsByNode[id] || [];
    const kindTxt = n.kind === "route" ? (n.worker ? "Cloudflare Worker" : `API route · ${n.method}`) : n.layout ? "Shared layout" : n.sw ? "Service worker" : KIND[n.kind].toLowerCase().replace(/^./, (c) => c.toUpperCase());
    const g = n.guard;
    const guardChip = g && n.kind !== "page" ? `<span class="basis ${g.status === "checked" ? (g.basis === "library" || g.certainty === "library" ? "library" : "proven") : g.status === "none" ? "unresolved" : "inferred"}">${{ checked: "Login checked", partial: "Login check: partial", unenforced: "Login looked up, not enforced", none: "No login check", external: "Key checked outside this code" }[g.status]}</span>` : "";
    const grp = groupOf[id];
    const dirWord = (e) => e.kind === "relation" ? "linked" : e.from === id ? ({ read: "reads", write: "writes", import: "uses", load: "loads", link: "links to", fetchfile: "fetches", register: "installs" }[e.kind] || "sends to") : ({ read: "read by", write: "written by", import: "used by", load: "loaded by", link: "linked from", fetchfile: "fetched by", register: "installed by" }[e.kind] || "from");
    const link = (e) => { const other = e.from === id ? e.to : e.from; return `<button class="link" data-edge="${e.id}"><small>${dirWord(e)}${e.certainty !== "proven" ? " ·?" : ""}</small><span>${esc(label(byId[other]))}</span></button>`; };
    const shown = es.slice(0, 40);
    panel.innerHTML = `
      <button class="back" id="back">← Whole app</button>
      <div class="stack"><span class="eyebrow">${esc(kindTxt)}</span><h2>${esc(label(n))}</h2>
        ${n.file ? `<span class="chip" style="justify-self:start">${esc(n.file)}${n.line && n.line > 1 ? ":" + n.line : ""}</span>` : ""}${guardChip ? `<div>${guardChip}</div>` : ""}
        ${grp ? `<p class="muted" style="font-size:13px">In the group <button class="inline-link" data-vnode="group:${esc(grp.key)}">${esc(grp.label)}</button></p>` : ""}</div>
      ${fs.map((f) => `<div class="flag ${f.sev}"><span class="sev ${f.sev}" style="justify-self:start">${f.sev === "crit" ? "Fix now" : f.sev === "warn" ? "Fix soon" : "Review"}</span><strong>${esc(f.title)}</strong><span>${esc(f.text)}</span>
        <details class="more"><summary>Show the code</summary><div class="receipts" style="padding-left:0;margin-top:6px">${chainHtml(f.evidence)}</div></details></div>`).join("")}
      <div><h3>In plain English</h3>${claimsHtml(n.explain || [])}</div>
      ${es.length ? `<div><h3>Connected to · ${es.length}</h3><div class="links">${shown.map(link).join("")}</div>${es.length > shown.length ? `<p class="muted" style="font-size:12.5px;margin-top:6px">and ${es.length - shown.length} more</p>` : ""}</div>` : ""}
      ${n.files?.length > 1 ? `<details class="more"><summary>${n.files.length} files make up this page</summary><ul class="files" style="margin-top:6px">${n.files.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></details>` : ""}`;
    wire();
  }
  function selectGroup(vid) {
    const vn = V.nodes.find((n) => n.id === vid); if (!vn) return;
    selected = vid;
    const vEs = V.edges.filter((e) => e.from === vid || e.to === vid);
    focus(new Set([vid, ...vEs.flatMap((e) => [e.from, e.to])]), new Set(vEs.map((e) => e.id)));
    const { fs } = worstIn(vn.members);
    const title = vn.zoneDef ? vn.zoneDef.label.charAt(0) + vn.zoneDef.label.slice(1).toLowerCase() : vn.group.label;
    const rule = vn.zoneDef ? "Everything in this part of the app." : vn.group.rule;
    const vname = (id) => { const x = V.nodes.find((n) => n.id === id); return x.real ? label(x.real) : x.zoneDef ? x.zoneDef.label.charAt(0) + x.zoneDef.label.slice(1).toLowerCase() : x.group.label; };
    const members = vn.members.slice().sort((a, b) => label(byId[a]).localeCompare(label(byId[b])));
    panel.innerHTML = `
      <button class="back" id="back">← Whole app</button>
      <div class="stack"><span class="eyebrow">${vn.zoneDef ? "Zone" : "Group"} · ${esc(countsText(vn.members))}</span><h2>${esc(title)}</h2>
        <p><strong>Why these are together:</strong> ${esc(rule)}</p>
        <div class="actions"><button class="btn" data-open="${esc(vid)}">${vn.zoneDef ? "Show the groups" : "Open this group on the drawing"}</button></div></div>
      ${fs.length ? `<div><h3>Inside: things to look at · ${fs.length}</h3><ul class="claims" style="gap:6px">${fs.map(findingBtn).join("")}</ul></div>` : ""}
      ${vEs.length ? `<div><h3>Pipes in and out · ${vEs.reduce((a, e) => a + e.members.length, 0)}</h3><div class="links">${vEs.map((e) => `<button class="link" ${e.real ? `data-edge="${e.real.id}"` : `data-agg="${esc(e.id)}"`}><small>${e.from === vid ? "to" : "from"} · ${e.members.length}</small><span>${esc(vname(e.from === vid ? e.to : e.from))}</span></button>`).join("")}</div></div>` : ""}
      ${vn.internal ? `<p class="muted">${vn.internal} more pipe${vn.internal === 1 ? "" : "s"} connect parts inside this ${vn.zoneDef ? "zone" : "group"}.</p>` : ""}
      <div><h3>The parts · ${members.length}</h3><div class="links">${members.slice(0, 80).map((id) => `<button class="link" data-node="${esc(id)}"><small>${esc((byId[id].sw ? "service worker" : KIND[byId[id].kind] || "").toLowerCase())}</small><span>${esc(label(byId[id]))}</span></button>`).join("")}</div>${members.length > 80 ? `<p class="muted">and ${members.length - 80} more</p>` : ""}</div>`;
    wire();
  }
  function selectAgg(aid) {
    const ve = V.edges.find((e) => e.id === aid); if (!ve) return;
    selected = null;
    focus(new Set([ve.from, ve.to]), new Set([aid]));
    const vname = (id) => { const x = V.nodes.find((n) => n.id === id); return x.real ? label(x.real) : x.zoneDef ? x.zoneDef.label.charAt(0) + x.zoneDef.label.slice(1).toLowerCase() : x.group.label; };
    const members = ve.members.map((id) => G.edges.find((e) => e.id === id));
    const kinds = {}; members.forEach((e) => (kinds[e.kind] = (kinds[e.kind] || 0) + 1));
    const notProven = members.filter((e) => e.certainty !== "proven").length;
    panel.innerHTML = `
      <button class="back" id="back">← Whole app</button>
      <div class="stack"><span class="eyebrow">${members.length} pipes, drawn as one</span><h2>${esc(vname(ve.from))} <span class="muted" style="font-weight:500">→</span> ${esc(vname(ve.to))}</h2>
        <div>${notProven ? `<span class="basis inferred">${notProven} not proven</span>` : `<span class="basis proven">All proven from code</span>`}</div></div>
      <p class="muted">${Object.entries(kinds).map(([k, v]) => `${v} ${{ import: "module uses", load: "script loads", read: "reads", write: "writes", request: "requests", service: "service calls", link: "links", fetchfile: "file fetches", register: "worker installs", callback: "callbacks", relation: "table links" }[k] || k}`).join(" · ")}</p>
      <div><h3>Every pipe</h3><div class="links">${members.slice(0, 120).map((e) => `<button class="link" data-edge="${e.id}"><small>${esc(e.label || e.kind)}</small><span>${esc(label(byId[e.from]))} → ${esc(label(byId[e.to]))}</span></button>`).join("")}</div>${members.length > 120 ? `<p class="muted">and ${members.length - 120} more</p>` : ""}</div>`;
    wire();
  }
  function selectEdge(eid) {
    const e = G.edges.find((x) => x.id === eid); if (!e) return;
    selected = null;
    focusReal(new Set([e.from, e.to]), new Set([e.id]));
    const a = byId[e.from], b = byId[e.to];
    const verb = { request: "sends requests to", read: "reads", write: "writes to", service: "calls", relation: "is linked to", callback: "calls", import: "uses", load: "loads", link: "links to", fetchfile: "fetches files from", register: "installs" }[e.kind] || "connects to";
    const basis = e.certainty === "proven" ? `<span class="basis proven">Proven from code</span>` : e.certainty === "inferred" ? `<span class="basis inferred">Inferred, not provable from code</span>` : `<span class="basis unresolved">Not fixed in the code</span>`;
    const hidden = V.rep[e.from] !== e.from || V.rep[e.to] !== e.to;
    panel.innerHTML = `
      <button class="back" id="back">← Whole app</button>
      <div class="stack"><span class="eyebrow">Pipe</span><h2>${esc(label(a))} <span class="muted" style="font-weight:500">${verb}</span> ${esc(label(b))}</h2><div>${basis}</div></div>
      ${hidden ? `<p class="muted" style="font-size:13px">Drawn inside a group at this zoom level.</p>` : ""}
      ${e.label || e.ops || e.paths ? `<p>${esc([e.label, e.ops ? "(" + e.ops.join(", ") + ")" : "", e.paths ? e.paths.slice(0, 4).join(", ") : ""].filter(Boolean).join(" "))}</p>` : ""}
      ${e.admin ? `<div class="flag warn"><strong>Uses the admin key</strong><span>This access skips the table's row-level security, so the code alone decides what's allowed.</span></div>` : ""}
      ${e.why ? `<p class="muted">${esc(e.why)}</p>` : ""}
      ${e.evidence?.length ? `<div><h3>How we know</h3><div class="receipts" style="padding-left:0">${chainHtml(e.evidence)}</div></div>` : ""}
      <div class="links"><button class="link" data-node="${esc(a.id)}"><small>from</small><span>${esc(label(a))}</span></button><button class="link" data-node="${esc(b.id)}"><small>to</small><span>${esc(label(b))}</span></button></div>`;
    wire();
  }

  // ---------- search ----------
  document.getElementById("search").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const hit = G.nodes.find((n) => label(n).toLowerCase() === q) || G.nodes.find((n) => label(n).toLowerCase().includes(q) || (n.file || "").toLowerCase().includes(q));
    if (hit) reveal(hit.id);
  });

  if (window.ELK && GRAPHS.length) load(start);
  else document.getElementById("loading").textContent = "Couldn't load the layout engine.";
})();
</script>
